<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blossom Flower Shop - Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
    }

    header {
      background-color: #f57c00;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }

    .products {
      padding: 20px;
      margin-bottom: 100px; /* space for chatbot */
    }

    .products h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #444;
    }

    .cards {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      width: 220px;
      padding: 15px;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 180px;
      border-radius: 10px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px 0 5px;
    }

    .card p {
      color: #555;
    }

    .chat-container {
      position: fixed;
      bottom: 0;
      right: 20px;
      width: 350px;
      max-height: 500px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 10px 10px 0 0;
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }

    .chat-messages {
      flex-grow: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      margin: 10px 0;
      max-width: 80%;
      padding: 10px 15px;
      border-radius: 20px;
      clear: both;
    }

    .user-message {
      background-color: #e0f7fa;
      align-self: flex-end;
      margin-left: auto;
    }

    .bot-message {
      background-color: #f5f5f5;
      align-self: flex-start;
      margin-right: auto;
    }

    .input-container {
      display: flex;
      border-top: 1px solid #ccc;
      padding: 10px;
      gap: 10px;
    }

    .input-container input {
      flex-grow: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
    }

    .input-container button {
      background-color: #f57c00;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    .input-container button:hover {
      background-color: #e65100;
    }
  </style>
</head>
<body>

  <header>Welcome to Blossom Flower Shop 💐</header>

  <div class="products">
    <h2>Our Bestsellers 🌸</h2>
    <div class="cards">
      <div class="card">
        <img src="https://media.istockphoto.com/id/1460940820/photo/colorful-flower-shop-display.jpg?s=1024x1024&w=is&k=20&c=A6ESxs_XXdZRkE3xs90LBduMBCEeONvfD7_pHgASz24=" alt="Roses">
        <h3>Red Roses</h3>
        <p>$15 / bouquet</p>
      </div>
      <div class="card">
        <img src="https://sweetpeasflowerfarm.com/wp-content/uploads/2023/04/Tulips-Sweet-Peas-Flower-Farm-06.jpg" alt="Tulips">
        <h3>Colorful Tulips</h3>
        <p>$18 / bouquet</p>
      </div>
      <div class="card">
        <img src="https://tigerlily.com/cdn/shop/files/classic-white-lilies-195200.jpg?v=1727720295&width=1500" alt="Lilies">
        <h3>White Lilies</h3>
        <p>$20 / bouquet</p>
      </div>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <!-- Messages appear here -->
    </div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    function sendMessage() {
      const inputField = document.getElementById('userInput');
      const userText = inputField.value.trim();
      if (!userText) return;

      appendMessage(userText, 'user-message');
      inputField.value = '';

      fetch(`/get?msg=${encodeURIComponent(userText)}`)
        .then(response => response.json())
        .then(data => {
          appendMessage(data.response, 'bot-message');
        });
    }

    function appendMessage(text, className) {
      const messageEl = document.createElement('div');
      messageEl.className = `message ${className}`;
      messageEl.textContent = text;
      const chatBox = document.getElementById('chatMessages');
      chatBox.appendChild(messageEl);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
